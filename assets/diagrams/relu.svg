<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 60" width="80" height="60" role="img" aria-label="ReLU: flat at zero for negative input, then linear">
  <!-- axes -->
  <line x1="10" y1="52" x2="74" y2="52" stroke="#b0b0b0" stroke-width="1.5" />
  <line x1="34" y1="6" x2="34" y2="56" stroke="#b0b0b0" stroke-width="1.5" />
  <!-- ticks -->
  <g stroke="#b0b0b0" stroke-width="1">
    <line x1="18" y1="49" x2="18" y2="55" />
    <line x1="50" y1="49" x2="50" y2="55" />
    <line x1="64" y1="49" x2="64" y2="55" />
    <line x1="31" y1="40" x2="37" y2="40" />
    <line x1="31" y1="24" x2="37" y2="24" />
  </g>
  <!-- relu hinge -->
  <polyline points="10,52 34,52 70,10" fill="none" stroke="#757575" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
